server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Header bảo mật áp cho mọi response; khai báo lại trong từng location vì nginx không kế thừa add_header
    # khi location có add_header riêng.
    set $csp "default-src 'self'; script-src 'self' https://js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://api.stripe.com https://*.ingest.sentry.io; frame-src https://js.stripe.com https://hooks.stripe.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Tệp có hash trong tên: cache lâu.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA: mọi đường dẫn khác trả index.html để router phía client xử lý.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri /index.html;
    }
}
