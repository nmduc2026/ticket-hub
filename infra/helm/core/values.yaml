# Thành phần nền cho staging k3d. Bản đơn giản: một replica, dữ liệu trên PVC local-path.
# Mật khẩu và client secret nằm trong Secret tạo tay (docs/ops/k8s-staging.md), không nằm ở đây.
publicAuthUrl: https://auth.tickethub.localhost

postgres:
  image: postgres:17.6
  storage: 5Gi
  database: tickethub
  user: tickethub
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

redis:
  image: redis:7.4.5
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

keycloak:
  image: quay.io/keycloak/keycloak:26.3.3
  resources:
    requests: { cpu: 250m, memory: 768Mi }
    limits: { memory: 1Gi }

mailpit:
  image: axllent/mailpit:v1.27.7
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { memory: 128Mi }

s3mock:
  image: adobe/s3mock:5.2.3
  bucket: tickethub-media
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits: { memory: 384Mi }
