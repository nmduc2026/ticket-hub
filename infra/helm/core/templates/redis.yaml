{{- if not .Values.redis.sentinel.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: { app.kubernetes.io/name: redis }
  ports:
    - { name: redis, port: 6379, targetPort: redis }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: redis }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: tickethub
        tickethub/role: redis
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          # Mật khẩu lấy từ biến môi trường, không đưa vào args hiển thị trong manifest.
          command: [sh, -c, 'exec redis-server --requirepass "$REDIS_PASSWORD" --save "" --appendonly no']
          ports:
            - { name: redis, containerPort: 6379 }
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: tickethub-redis, key: password } }
          readinessProbe:
            exec:
              command: [sh, -c, 'redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [sh, -c, 'redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
            periodSeconds: 20
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
{{- end }}
