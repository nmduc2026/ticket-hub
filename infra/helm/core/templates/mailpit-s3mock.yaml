apiVersion: v1
kind: Service
metadata:
  name: mailpit
spec:
  selector: { app.kubernetes.io/name: mailpit }
  ports:
    - { name: smtp, port: 1025, targetPort: smtp }
    - { name: ui, port: 8025, targetPort: ui }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: mailpit }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailpit
        app.kubernetes.io/part-of: tickethub
        tickethub/role: mailpit
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mailpit
          image: {{ .Values.mailpit.image | quote }}
          ports:
            - { name: smtp, containerPort: 1025 }
            - { name: ui, containerPort: 8025 }
          readinessProbe:
            httpGet: { path: /readyz, port: ui }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /livez, port: ui }
            periodSeconds: 20
          resources:
            {{- toYaml .Values.mailpit.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: s3mock
spec:
  selector: { app.kubernetes.io/name: s3mock }
  ports:
    - { name: http, port: 9090, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3mock
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: s3mock }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: s3mock
        app.kubernetes.io/part-of: tickethub
        tickethub/role: s3mock
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: s3mock
          image: {{ .Values.s3mock.image | quote }}
          ports:
            - { name: http, containerPort: 9090 }
          env:
            - { name: COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS, value: {{ .Values.s3mock.bucket | quote }} }
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.s3mock.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
