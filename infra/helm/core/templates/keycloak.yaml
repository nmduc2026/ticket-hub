apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector: { app.kubernetes.io/name: keycloak }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: keycloak }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/part-of: tickethub
        tickethub/role: keycloak
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: keycloak
          image: {{ .Values.keycloak.image | quote }}
          # Realm tickethub nạp từ ConfigMap `keycloak-realm` (tạo tay từ infra/keycloak/tickethub-realm.json).
          args: ["start", "--import-realm"]
          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 9000 }
          env:
            - { name: KC_DB, value: postgres }
            - { name: KC_DB_URL, value: "jdbc:postgresql://{{ .Values.postgres.host }}:5432/keycloak" }
            - { name: KC_DB_USERNAME, value: {{ .Values.postgres.user | quote }} }
            - name: KC_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: tickethub-db, key: password } }
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom: { secretKeyRef: { name: tickethub-keycloak, key: admin-user } }
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: tickethub-keycloak, key: admin-password } }
            - { name: KC_HOSTNAME, value: {{ .Values.publicAuthUrl | quote }} }
            - { name: KC_HTTP_ENABLED, value: "true" }
            - { name: KC_PROXY_HEADERS, value: xforwarded }
            - { name: KC_HEALTH_ENABLED, value: "true" }
            - name: KEYCLOAK_BFF_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: tickethub-keycloak, key: bff-client-secret } }
            - name: KEYCLOAK_INTERNAL_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: tickethub-keycloak, key: internal-client-secret } }
            - name: KEYCLOAK_ACCOUNT_ADMIN_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: tickethub-keycloak, key: account-admin-client-secret } }
          startupProbe:
            httpGet: { path: /health/ready, port: management }
            periodSeconds: 10
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /health/ready, port: management }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: management }
            periodSeconds: 20
          resources:
            {{- toYaml .Values.keycloak.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: realm, mountPath: /opt/keycloak/data/import, readOnly: true }
      volumes:
        - name: realm
          configMap: { name: keycloak-realm }
