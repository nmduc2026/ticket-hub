# Chart gateway (BFF, Spring Cloud Gateway). Secret chỉ tham chiếu.
image:
  repository: ghcr.io/nmduc2026/ticket-hub-gateway
  tag: sha-333268766485337e23d69291b5c98363f337b9d7
  pullPolicy: IfNotPresent

replicaCount: 1
containerPort: 8080
runAsUser: 65532
service:
  port: 8080
pdb:
  maxUnavailable: 1

# Tắt êm (docs/ops/autoscaling.md): 10 giây preStop + tối đa 30 giây chờ request = 40 < 45.
terminationGracePeriodSeconds: 45
preStopSeconds: 10

probes:
  startup: /actuator/health/liveness
  startupFailureThreshold: 36
  readiness: /actuator/health/readiness
  liveness: /actuator/health/liveness

resources:
  requests: { cpu: 250m, memory: 384Mi }
  limits: { memory: 512Mi }

env:
  SHUTDOWN_TIMEOUT: 30s
  APP_URI: http://app:8081
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  # Nối Redis qua Sentinel (chart core, redis.sentinel.enabled): đổi master không cần restart. Biến này ghi đè REDIS_HOST.
  SPRING_DATA_REDIS_SENTINEL_MASTER: tickethub
  SPRING_DATA_REDIS_SENTINEL_NODES: redis-0.redis-headless:26379,redis-1.redis-headless:26379,redis-2.redis-headless:26379
  KEYCLOAK_ISSUER_URI: https://auth.tickethub.localhost/realms/tickethub
  GATEWAY_COOKIE_SECURE: "true"
  # Trace xuyên Gateway → app (docs/ops/observability.md).
  OTLP_TRACES_ENABLED: "true"
  OTLP_TRACES_ENDPOINT: http://jaeger.monitoring.svc:4318/v1/traces

secretEnv:
  - { name: REDIS_PASSWORD, secret: tickethub-redis, key: password }
  - { name: KEYCLOAK_BFF_CLIENT_SECRET, secret: tickethub-keycloak, key: bff-client-secret }

# Chỉ Envoy Gateway (namespace envoy-gateway-system) được gọi vào đây; NetworkPolicy ở việc 13.
podLabels:
  tickethub/role: gateway
