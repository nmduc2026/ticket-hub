# Reverse proxy trên EC2: CloudFront → nginx (cổng 80) → Gateway hoặc Keycloak. TLS kết thúc ở CloudFront.
server {
    listen 80 default_server;
    server_name _;

    # Domain công khai (CloudFront) do AllViewer chuyển xuống qua Host; giao thức luôn là https ở phía người dùng.
    set $public_host $http_host;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Giao diện quản trị Keycloak và realm master không phơi ra Internet; chỉ realm tickethub (đăng nhập, tài khoản).
    location ~ ^/auth/(admin|realms/master) {
        return 404;
    }

    location /auth/ {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host $public_host;
        proxy_set_header X-Forwarded-Host $public_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }

    location / {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $public_host;
        proxy_set_header X-Forwarded-Host $public_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }
}
