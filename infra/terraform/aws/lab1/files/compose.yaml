name: tickethub-lab1

# Chạy trên EC2 bằng /opt/tickethub (user_data.sh.tftpl ghi .env cạnh file này). Không chứa secret: mọi giá trị đọc từ .env.
services:
  nginx:
    image: nginx:1.29.3-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      gateway:
        condition: service_started
      keycloak:
        condition: service_healthy
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: ${LOG_GROUP}
        awslogs-stream: nginx
    mem_limit: 64m
    restart: unless-stopped

  redis:
    image: redis:7.4.5
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 128m
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${DB_HOST}:5432/keycloak?sslmode=require
      KC_DB_USERNAME: tickethub
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: 8080
      KC_HTTP_RELATIVE_PATH: /auth
      # Địa chỉ công khai gồm cả /auth; sau CloudFront + nginx nên đọc X-Forwarded-*.
      KC_HOSTNAME: ${PUBLIC_URL}/auth
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_BFF_CLIENT_SECRET: ${KEYCLOAK_BFF_CLIENT_SECRET}
      KEYCLOAK_INTERNAL_CLIENT_SECRET: ${KEYCLOAK_INTERNAL_CLIENT_SECRET}
      KEYCLOAK_ACCOUNT_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ACCOUNT_ADMIN_CLIENT_SECRET}
    volumes:
      - ./realm:/opt/keycloak/data/import:ro
      - ./themes/tickethub:/opt/keycloak/themes/tickethub:ro
    healthcheck:
      # Image không có curl: kiểm tra cổng quản trị 9000 bằng /dev/tcp (đường dẫn theo KC_HTTP_RELATIVE_PATH).
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: ${LOG_GROUP}
        awslogs-stream: keycloak
    mem_limit: 1g
    restart: unless-stopped

  app:
    image: ${APP_IMAGE}
    environment:
      DB_URL: jdbc:postgresql://${DB_HOST}:5432/tickethub?sslmode=require
      DB_USER: tickethub
      DB_PASSWORD: ${DB_PASSWORD}
      # iss mong đợi là địa chỉ công khai; khoá ký lấy qua mạng nội bộ cho khỏi vòng qua CloudFront.
      KEYCLOAK_ISSUER_URI: ${PUBLIC_URL}/auth/realms/tickethub
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/auth/realms/tickethub/protocol/openid-connect/certs
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    depends_on:
      keycloak:
        condition: service_healthy
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: ${LOG_GROUP}
        awslogs-stream: app
    mem_limit: 768m
    restart: unless-stopped

  gateway:
    image: ${GATEWAY_IMAGE}
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      APP_URI: http://app:8081
      KEYCLOAK_BFF_CLIENT_SECRET: ${KEYCLOAK_BFF_CLIENT_SECRET}
      # Gateway kiểm iss của Keycloak nên dùng địa chỉ công khai (đi vòng qua CloudFront khi khởi động).
      KEYCLOAK_ISSUER_URI: ${PUBLIC_URL}/auth/realms/tickethub
      GATEWAY_COOKIE_SECURE: "true"
    depends_on:
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      app:
        condition: service_started
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: ${LOG_GROUP}
        awslogs-stream: gateway
    mem_limit: 512m
    restart: unless-stopped
