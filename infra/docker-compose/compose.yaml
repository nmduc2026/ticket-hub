name: tickethub

# Profile `core`: Postgres, Redis, Keycloak, Mailpit (overview.md §19.2).
# `app` và `gateway` vào profile này khi có image (việc 8).
services:
  postgres:
    image: postgres:17.6
    profiles: [core]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m

  redis:
    image: redis:7.4.5
    profiles: [core]
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    mem_limit: 256m

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    profiles: [core]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:?}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: "true"
      # Realm export dùng ${...} cho client secret, không commit giá trị thật.
      KEYCLOAK_BFF_CLIENT_SECRET: ${KEYCLOAK_BFF_CLIENT_SECRET:?}
      KEYCLOAK_INTERNAL_CLIENT_SECRET: ${KEYCLOAK_INTERNAL_CLIENT_SECRET:?}
      KEYCLOAK_ACCOUNT_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ACCOUNT_ADMIN_CLIENT_SECRET:?}
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ../keycloak:/opt/keycloak/data/import:ro
      - ../keycloak/themes/tickethub:/opt/keycloak/themes/tickethub:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Image không có curl: kiểm tra cổng quản trị 9000 bằng /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    mem_limit: 1g

  mailpit:
    image: axllent/mailpit:v1.27.7
    profiles: [core]
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 128m

volumes:
  postgres-data:
  redis-data:
