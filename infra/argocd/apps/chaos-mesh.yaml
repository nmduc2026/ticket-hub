apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chaos-mesh
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://charts.chaos-mesh.org
    chart: chaos-mesh
    # Chưa xác nhận phiên bản trên mạng: kiểm bằng `helm search repo chaos-mesh/chaos-mesh` trước khi đồng bộ (infra/chaos/README.md).
    targetRevision: 2.7.2
    helm:
      valuesObject:
        chaosDaemon:
          # k3s/k3d dùng containerd của riêng nó.
          runtime: containerd
          socketPath: /run/k3s/containerd/containerd.sock
        dashboard:
          # Không dùng giao diện web; thí nghiệm áp bằng kubectl từ file trong infra/chaos.
          create: false
        controllerManager:
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 256Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: chaos-mesh
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
