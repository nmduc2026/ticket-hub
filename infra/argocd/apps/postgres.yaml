apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres
  namespace: argocd
  annotations:
    # Sau operator (wave 0); trước core / app, vì Keycloak và app cần database.
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/nmduc2026/ticket-hub.git
    targetRevision: main
    path: infra/k8s-platform/postgres
  destination:
    server: https://kubernetes.default.svc
    namespace: tickethub
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, SkipDryRunOnMissingResource=true]
