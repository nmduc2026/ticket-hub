apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda
  namespace: argocd
  annotations:
    # Cùng đợt với operator khác (wave 0): CRD ScaledObject phải có trước `autoscaling`.
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://kedacore.github.io/charts
    chart: keda
    # Chưa xác nhận phiên bản trên mạng: kiểm bằng `helm search repo kedacore/keda` trước khi đồng bộ (docs/ops/autoscaling.md).
    targetRevision: 2.17.2
  destination:
    server: https://kubernetes.default.svc
    namespace: keda
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
