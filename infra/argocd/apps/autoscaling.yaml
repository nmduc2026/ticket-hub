apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: autoscaling
  namespace: argocd
  annotations:
    # Sau app / gateway (wave 2) và KEDA (wave 0).
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/nmduc2026/ticket-hub.git
    targetRevision: main
    path: infra/k8s-platform/autoscaling
  destination:
    server: https://kubernetes.default.svc
    namespace: tickethub
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
