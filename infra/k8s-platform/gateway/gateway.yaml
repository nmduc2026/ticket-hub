# Ingress bằng Gateway API + Envoy Gateway (ADR 0014). cert-manager cấp chứng chỉ cho từng listener qua annotation.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tickethub
  namespace: tickethub
  annotations:
    cert-manager.io/cluster-issuer: tickethub-ca
spec:
  gatewayClassName: envoy
  listeners:
    - name: web
      hostname: tickethub.localhost
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs: [{ name: tickethub-web-tls }]
      allowedRoutes: { namespaces: { from: Same } }
    - name: auth
      hostname: auth.tickethub.localhost
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs: [{ name: tickethub-auth-tls }]
      allowedRoutes: { namespaces: { from: Same } }
    - name: web-http
      hostname: tickethub.localhost
      port: 80
      protocol: HTTP
      allowedRoutes: { namespaces: { from: Same } }
---
# HTTP -> HTTPS
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redirect-https
  namespace: tickethub
spec:
  parentRefs: [{ name: tickethub, sectionName: web-http }]
  hostnames: [tickethub.localhost]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: { scheme: https, statusCode: 301 }
---
# /api và luồng OIDC của BFF vào Gateway; còn lại là SPA tĩnh.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
  namespace: tickethub
spec:
  parentRefs: [{ name: tickethub, sectionName: web }]
  hostnames: [tickethub.localhost]
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api }
        - path: { type: PathPrefix, value: /oauth2 }
        - path: { type: PathPrefix, value: /login/oauth2 }
        - path: { type: PathPrefix, value: /logout }
      backendRefs: [{ name: gateway, port: 8080 }]
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs: [{ name: frontend, port: 8080 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: auth
  namespace: tickethub
spec:
  parentRefs: [{ name: tickethub, sectionName: auth }]
  hostnames: [auth.tickethub.localhost]
  rules:
    - backendRefs: [{ name: keycloak, port: 8080 }]
