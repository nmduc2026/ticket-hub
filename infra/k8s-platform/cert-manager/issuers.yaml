# CA tự ký cho local/staging: selfsigned -> CA -> ClusterIssuer `tickethub-ca`. Trình duyệt cần tin CA này
# (kubectl -n cert-manager get secret tickethub-ca -o jsonpath='{.data.ca\.crt}' | base64 -d).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tickethub-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: tickethub-local-ca
  secretName: tickethub-ca
  privateKey: { algorithm: ECDSA, size: 256 }
  issuerRef: { name: selfsigned, kind: ClusterIssuer }
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: tickethub-ca
spec:
  ca:
    secretName: tickethub-ca
