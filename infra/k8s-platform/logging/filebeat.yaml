# Filebeat đọc log JSON (logstash format) của pod trong namespace tickethub, đẩy vào Elasticsearch.
# ILM: rollover mỗi ngày, xoá sau 7 ngày (AC-11). Trường traceId, bookingId... nằm sẵn trong JSON log nên chỉ cần giải mã.
apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-ilm
  namespace: logging
data:
  ilm-policy.json: |
    {
      "policy": {
        "phases": {
          "hot": { "actions": { "rollover": { "max_age": "1d", "max_primary_shard_size": "2gb" } } },
          "delete": { "min_age": "7d", "actions": { "delete": {} } }
        }
      }
    }
---
apiVersion: beat.k8s.elastic.co/v1beta1
kind: Beat
metadata:
  name: filebeat
  namespace: logging
spec:
  type: filebeat
  version: 9.1.4
  elasticsearchRef:
    name: tickethub
  config:
    filebeat.autodiscover:
      providers:
        - type: kubernetes
          node: ${NODE_NAME}
          hints.enabled: false
          templates:
            - condition:
                equals: { kubernetes.namespace: tickethub }
              config:
                - type: container
                  paths: ["/var/log/containers/*-${data.kubernetes.container.id}.log"]
                  parsers:
                    # Dòng log của app / gateway là một JSON object: giải mã thành trường riêng (traceId, level, ...).
                    - ndjson: { target: "", add_error_key: true, message_key: message, overwrite_keys: true }
    processors:
      - add_cloud_metadata: {}
      - add_kubernetes_metadata: {}
    setup.ilm:
      enabled: true
      policy_name: tickethub-logs
      policy_file: /usr/share/filebeat/ilm/ilm-policy.json
      overwrite: true
  daemonSet:
    podTemplate:
      spec:
        serviceAccountName: filebeat
        automountServiceAccountToken: true
        terminationGracePeriodSeconds: 30
        dnsPolicy: ClusterFirstWithHostNet
        securityContext:
          runAsUser: 0
        containers:
          - name: filebeat
            env:
              - name: NODE_NAME
                valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            volumeMounts:
              - { name: varlogcontainers, mountPath: /var/log/containers }
              - { name: varlogpods, mountPath: /var/log/pods }
              - { name: varlibdockercontainers, mountPath: /var/lib/docker/containers }
              - { name: ilm, mountPath: /usr/share/filebeat/ilm }
            resources:
              requests: { cpu: 50m, memory: 100Mi }
              limits: { memory: 200Mi }
        volumes:
          - { name: varlogcontainers, hostPath: { path: /var/log/containers } }
          - { name: varlogpods, hostPath: { path: /var/log/pods } }
          - { name: varlibdockercontainers, hostPath: { path: /var/lib/docker/containers } }
          - { name: ilm, configMap: { name: filebeat-ilm } }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: filebeat
  namespace: logging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: filebeat
rules:
  - apiGroups: [""]
    resources: [namespaces, pods, nodes]
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources: [replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: filebeat
subjects:
  - kind: ServiceAccount
    name: filebeat
    namespace: logging
roleRef:
  kind: ClusterRole
  name: filebeat
  apiGroup: rbac.authorization.k8s.io
