<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Ticket Hub — Vé của tôi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap">
<style>
/* === Ticket Hub tokens — nguồn: docs/design/README.md §2. Không sửa tay mã màu trong file, dùng var(--…). === */
:root,[data-mode]{--font:'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;--bg:#FFFFFF;--bg-subtle:#F6F7F6;--surface:#FFFFFF;--surface-2:#F1F3F2;--surface-3:#E7EBE9;--fg:#0A0F0D;--fg-2:#3D4642;--fg-muted:#5A6461;--border:#E3E7E5;--border-strong:#C5CDC9;--input-bg:#FFFFFF;--primary:#047857;--primary-hover:#065F46;--on-primary:#FFFFFF;--primary-strong:#059669;--primary-soft:#E7F5EF;--on-primary-soft:#065F46;--primary-border:#A7F3D0;--accent-text:#047857;--ring:rgba(4,120,87,.22);--focus:#047857;--inverse:#0A0F0D;--on-inverse:#FFFFFF;--night:#022C22;--on-night:#ECFDF5;--on-night-muted:#A7C9BC;--night-border:#0F4A3B;--danger:#DC2626;--danger-hover:#B91C1C;--danger-text:#B91C1C;--danger-soft:#FEF2F2;--danger-border:#FECACA;--on-danger-soft:#7F1D1D;--warning-dot:#F59E0B;--warning-text:#B45309;--warning-soft:#FFFBEB;--warning-border:#FDE68A;--on-warning-soft:#78350F;--success-dot:#16A34A;--success-text:#15803D;--success-soft:#F0FDF4;--info-dot:#2563EB;--info-text:#1D4ED8;--info-soft:#EFF6FF;--on-info-soft:#1E3A8A;--neutral-dot:#8A938F;--hot:#FBBF24;--on-hot:#3B2504;--hot-text:#B45309;--scrim:rgba(10,15,13,.5);--skeleton:#ECEFED;--shadow-sm:0 1px 2px rgba(10,15,13,.06);--shadow-md:0 8px 24px rgba(10,15,13,.10);--tier-1:#C2410C;--tier-2:#1D4ED8;--tier-3:#A21CAF;--seat-off:#DCE2DF;--seat-off-mark:#9AA49F;color-scheme:light}
[data-mode="dark"]{--bg:#0A0F0D;--bg-subtle:#0E1412;--surface:#121A17;--surface-2:#18221E;--surface-3:#212C27;--fg:#E8EFEC;--fg-2:#C3CEC9;--fg-muted:#9AA7A2;--border:#222C28;--border-strong:#36433E;--input-bg:#121A17;--primary:#34D399;--primary-hover:#6EE7B7;--on-primary:#022C22;--primary-strong:#10B981;--primary-soft:#0C2D23;--on-primary-soft:#6EE7B7;--primary-border:#14543F;--accent-text:#34D399;--ring:rgba(110,231,183,.3);--focus:#6EE7B7;--inverse:#E8EFEC;--on-inverse:#0A0F0D;--night:#03251D;--danger:#DC2626;--danger-hover:#B91C1C;--danger-text:#F87171;--danger-soft:#3A1416;--danger-border:#5C1F22;--on-danger-soft:#FCA5A5;--warning-dot:#FBBF24;--warning-text:#FBBF24;--warning-soft:#3A2A08;--warning-border:#5C4410;--on-warning-soft:#FCD34D;--success-dot:#4ADE80;--success-text:#4ADE80;--success-soft:#0F2A1A;--info-dot:#60A5FA;--info-text:#60A5FA;--info-soft:#12233F;--on-info-soft:#BFDBFE;--neutral-dot:#7D8A85;--hot-text:#FCD34D;--scrim:rgba(0,0,0,.65);--skeleton:#1C2622;--shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow-md:0 8px 24px rgba(0,0,0,.45);--tier-1:#FB923C;--tier-2:#60A5FA;--tier-3:#E879F9;--seat-off:#26302B;--seat-off-mark:#4D5A55;color-scheme:dark}
@media (prefers-color-scheme: dark){[data-mode="system"]{--bg:#0A0F0D;--bg-subtle:#0E1412;--surface:#121A17;--surface-2:#18221E;--surface-3:#212C27;--fg:#E8EFEC;--fg-2:#C3CEC9;--fg-muted:#9AA7A2;--border:#222C28;--border-strong:#36433E;--input-bg:#121A17;--primary:#34D399;--primary-hover:#6EE7B7;--on-primary:#022C22;--primary-strong:#10B981;--primary-soft:#0C2D23;--on-primary-soft:#6EE7B7;--primary-border:#14543F;--accent-text:#34D399;--ring:rgba(110,231,183,.3);--focus:#6EE7B7;--inverse:#E8EFEC;--on-inverse:#0A0F0D;--night:#03251D;--danger:#DC2626;--danger-hover:#B91C1C;--danger-text:#F87171;--danger-soft:#3A1416;--danger-border:#5C1F22;--on-danger-soft:#FCA5A5;--warning-dot:#FBBF24;--warning-text:#FBBF24;--warning-soft:#3A2A08;--warning-border:#5C4410;--on-warning-soft:#FCD34D;--success-dot:#4ADE80;--success-text:#4ADE80;--success-soft:#0F2A1A;--info-dot:#60A5FA;--info-text:#60A5FA;--info-soft:#12233F;--on-info-soft:#BFDBFE;--neutral-dot:#7D8A85;--hot-text:#FCD34D;--scrim:rgba(0,0,0,.65);--skeleton:#1C2622;--shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow-md:0 8px 24px rgba(0,0,0,.45);--tier-1:#FB923C;--tier-2:#60A5FA;--tier-3:#E879F9;--seat-off:#26302B;--seat-off-mark:#4D5A55;color-scheme:dark}}
.th-root{background:var(--bg);color:var(--fg);font-family:var(--font);min-height:100vh}
b,strong{font-weight:600}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:0}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition-duration:0ms!important;animation-duration:0ms!important}}
/* === hết tokens === */
/* === Responsive chung (prototype dựng layout bằng style inline) === */
@media (max-width:760px){
main [style*="grid-template-columns"],main[style*="grid-template-columns"]{grid-template-columns:minmax(0,1fr)!important}
main [style*="display: flex; gap"],main [style*="display: flex; align-items: center; gap"]{flex-wrap:wrap}
main aside,main section{max-width:100%;box-sizing:border-box}
main>*{min-width:0}
main .alert{flex-wrap:wrap}
main input,main select,main textarea{max-width:100%}
main [style*="justify-content: space-between"]{flex-wrap:wrap;row-gap:8px}
main [style*="max-width: 1240px"],main[style*="max-width: 1240px"]{padding-left:16px!important;padding-right:16px!important}
main table{display:block;overflow-x:auto;max-width:100%;position:relative}
main div:has(>table),main section:has(>table){max-width:100%;overflow-x:auto}
}
/* === hết responsive chung === */

body{margin:0}
a{color:var(--fg)}a:hover{color:var(--fg)}
.tab{height:40px;padding:0 2px;border:none;border-bottom:2px solid transparent;background:transparent;font-family:inherit;font-size:14px;color:var(--fg-muted);cursor:pointer}
.tab-on{color:var(--fg);font-weight:500;border-bottom-color:var(--primary-strong)}
.item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--border);text-decoration:none;color:var(--fg)}
.pbtn{height:44px;min-width:44px;padding:0 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-family:inherit;font-size:14px;font-weight:500;color:var(--fg);display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.pbtn:disabled{opacity:.5;cursor:default}
/* === UX pass: dropdown chung, đóng khi click ra ngoài, toolbar 2 nhóm === */
.tb{display:flex;align-items:flex-start;gap:12px;flex-wrap:nowrap}
.tb-l{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tb-r{display:flex;gap:8px;align-items:center;flex-shrink:0}
.tb .btn-icon{width:32px}
.cnt-b{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--primary-soft);color:var(--on-primary-soft);font-size:12px;font-weight:600;box-sizing:border-box}
.ov-bd{position:absolute;inset:0}
.overlay>.dialog{z-index:1}
.csel{position:relative;display:block;min-width:0}
.csel-b{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;cursor:pointer;color:var(--fg);font-weight:400}
.csel-b>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.csel-b>svg{flex-shrink:0;color:var(--fg-muted)}
.csel-b:hover{border-color:var(--border-strong)}
.csel-b[aria-expanded="true"]{border-color:var(--focus);box-shadow:0 0 0 3px var(--ring)}
.csel-b[aria-expanded="true"]>svg{transform:rotate(180deg)}
.csel-bd{position:fixed;inset:0;z-index:90}
.csel-p{position:absolute;left:0;top:calc(100% + 4px);z-index:91;min-width:100%;width:max-content;max-width:320px;max-height:264px;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow-md);padding:4px;box-sizing:border-box}
.csel-up .csel-p{top:auto;bottom:calc(100% + 4px)}
.csel-o{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:34px;padding:0 8px;border:none;border-radius:6px;background:transparent;font:inherit;font-size:14px;color:var(--fg);text-align:left;cursor:pointer;white-space:nowrap}
.csel-o:hover{background:var(--surface-2)}
.csel-o[aria-selected="true"]{font-weight:500}
.csel-o>svg{color:var(--primary-strong);opacity:0;flex-shrink:0}
.csel-o[aria-selected="true"]>svg{opacity:1}
/* === hết UX pass === */
/* === UX pass 2 === */
.ov-bd,.bd,.csel-bd,.pal-bd,.sh-bd,.sheet-scrim{border:0;padding:0;margin:0;cursor:default;display:block;-webkit-appearance:none;appearance:none}
.ov-bd,.bd,.csel-bd{background:transparent}
.ov-bd:focus,.bd:focus,.csel-bd:focus,.pal-bd:focus,.sh-bd:focus,.sheet-scrim:focus{outline:none}
.toast,.toast-g{background:var(--surface)!important;color:var(--fg)!important;border:1px solid var(--border);box-shadow:var(--shadow-md)!important;border-radius:10px!important;padding:12px 12px 12px 14px!important}
.toast .btn,.toast-g .btn{color:var(--fg-muted)!important}
.menu{min-width:240px;padding:6px}
.menu .mi{min-height:36px;height:auto;padding:0 12px;gap:10px;white-space:nowrap}
::placeholder{font-family:var(--font);color:var(--fg-muted);opacity:1}
.csel-s{display:flex;align-items:center;gap:8px;padding:4px 8px 8px;margin:0 -4px 4px;border-bottom:1px solid var(--border);color:var(--fg-muted)}
.csel-s input{border:none;outline:none;background:transparent;font:inherit;font-size:14px;color:var(--fg);width:100%;min-width:0}
.csel-e{padding:10px 8px;color:var(--fg-muted);font-size:13px}
.csel-s,.fpop-s{position:sticky;top:-4px;z-index:2;background:var(--surface);box-shadow:0 -4px 0 var(--surface)}
.fpop{max-height:340px;overflow-y:auto}
/* === hết UX pass 2 === */
</style>
</helmet>
<div data-mode="{{themeMode}}" style="width: 390px; height: 844px; overflow: hidden; background: var(--surface); color: var(--fg); font-family: var(--font); font-size: 14px; display: flex; flex-direction: column; box-sizing: border-box" class="th-root">
<header style="height: 56px; padding: 0 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; flex-shrink: 0">
<a href="Main.dc.html" aria-label="Trang chủ" style="width: 28px; height: 28px; border-radius: 6px; background: var(--primary-strong); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 0 2-2h14a2 2 0 0 0 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 0-2 2H5a2 2 0 0 0-2-2v-2a2 2 0 0 0 0-4z"></path></svg></a>
<span style="font-size: 16px; font-weight: 600">Ticket Hub</span>
<span style="flex-grow: 1"></span>
<span style="width: 32px; height: 32px; border-radius: 50%; background: var(--primary-soft); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: var(--on-primary-soft)">AN</span>
</header>

<div style="padding: 16px 16px 0; display: flex; flex-direction: column; gap: 12px; flex-shrink: 0">
<h1 style="margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em">Vé của tôi</h1>
<label style="position: relative; display: flex; align-items: center">
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden">Tìm vé</span>
<svg style="stroke: var(--fg-muted); position: absolute; left: 12px" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
<input type="search" value="{{q}}" onChange="{{onSearch}}" placeholder="Tìm theo tên sự kiện, mã vé" style="width: 100%; height: 44px; border: 1px solid var(--border); border-radius: 8px; padding: 0 12px 0 36px; font-family: inherit; font-size: 14px; box-sizing: border-box; outline: none">
</label>
<div role="tablist" style="display: flex; gap: 20px; border-bottom: 1px solid var(--border)">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button type="button" role="tab" aria-selected="{{t.selected}}" class="{{t.cls}}" onClick="{{t.pick}}">{{t.label}}</button>
</sc-for>
</div>
</div>

<div style="flex-grow: 1; padding: 0 16px; overflow: hidden">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
<a href="TicketQR.dc.html" class="item">
<img src="{{r.img}}" alt="" style="width: 64px; height: 64px; border-radius: 8px; object-fit: cover; flex-shrink: 0; display: block">
<div style="display: flex; flex-direction: column; gap: 3px; min-width: 0; flex-grow: 1">
<span style="font-size: 15px; font-weight: 600">{{r.title}}</span>
<span style="font-size: 13px; color: var(--fg-muted)">{{r.when}}</span>
<div style="display: flex; justify-content: space-between; align-items: center; margin-top: 2px">
<span style="font-size: 13px; font-weight: 500">{{r.seat}}</span>
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg-2)"><span style="width: 6px; height: 6px; border-radius: 50%; background: {{r.dot}}"></span>{{r.status}}</span>
</div>
</div>
</a>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<p style="margin: 32px 0; text-align: center; color: var(--fg-muted)">Không có vé phù hợp.</p>
</sc-if>
</div>

<nav aria-label="Phân trang" style="padding: 12px 16px 20px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--border); flex-shrink: 0">
<button type="button" class="pbtn" disabled="{{atStart}}" onClick="{{prev}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>Trước</button>
<span style="font-size: 13px; color: var(--fg-muted)">Trang {{page}} / {{pageCount}}</span>
<button type="button" class="pbtn" disabled="{{atEnd}}" onClick="{{next}}">Sau<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}, "theme": {"editor": "enum", "options": ["system", "light", "dark"], "default": "system"}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'up', page: 1, q: '' };
  }
  renderVals() { return Object.assign({ themeMode: this.props.theme || 'system' }, this.renderBase()); }
  renderBase() {
    const valid = { status: 'Hợp lệ', dot: 'var(--success-dot)' };
    const used = { status: 'Đã sử dụng', dot: 'var(--neutral-dot)' };
    const refunded = { status: 'Đã hoàn tiền', dot: 'var(--neutral-dot)' };
    const rock = { img: 'https://images.unsplash.com/photo-1460723237483-7a6dc9d0b212?w=200&q=70&auto=format&fit=crop' };
    const autumn = { img: 'https://images.unsplash.com/photo-1465847899084-d164df4dedc6?w=200&q=70&auto=format&fit=crop' };
    const indie = { img: 'https://images.unsplash.com/photo-1506157786151-b8491531f063?w=200&q=70&auto=format&fit=crop' };
    const jazz = { img: 'https://images.unsplash.com/photo-1511192336575-5a79af67a629?w=200&q=70&auto=format&fit=crop' };
    const data = {
      up: [
        { title: 'Đêm nhạc Rock Sài Gòn', when: 'T7, 15/11 · 20:00 · Nhà hát Hòa Bình', seat: 'VIP · B7', ...rock, ...valid },
        { title: 'Đêm nhạc Rock Sài Gòn', when: 'T7, 15/11 · 20:00 · Nhà hát Hòa Bình', seat: 'VIP · B8', ...rock, ...valid },
        { title: 'Hòa nhạc Mùa Thu', when: 'CN, 22/11 · 19:30 · Nhà hát Lớn', seat: 'Standard · E12', ...autumn, ...valid },
        { title: 'Hòa nhạc Mùa Thu', when: 'CN, 22/11 · 19:30 · Nhà hát Lớn', seat: 'Standard · E13', ...autumn, ...valid },
        { title: 'Live Jazz cuối tuần', when: 'T7, 13/12 · 20:30 · Phòng trà Bến Thành', seat: 'Bàn 4 · Ghế 2', ...jazz, ...valid },
        { title: 'Live Jazz cuối tuần', when: 'T7, 13/12 · 20:30 · Phòng trà Bến Thành', seat: 'Bàn 4 · Ghế 3', ...jazz, ...valid },
      ],
      past: [
        { title: 'Indie Showcase vol.4', when: 'T7, 20/09 · 19:00 · Saigon Outcast', seat: 'Phổ thông · K3', ...indie, ...used },
        { title: 'Đêm nhạc Trịnh', when: 'CN, 07/09 · 20:00 · NVH Thanh niên', seat: 'Standard · D9', ...autumn, ...used },
      ],
      refund: [
        { title: 'Lễ hội Indie Đà Lạt', when: 'CN, 29/11 · 17:00 · Đà Lạt', seat: 'Phổ thông · K3', ...indie, ...refunded },
      ],
    };
    const q = this.state.q.trim().toLowerCase();
    const list = data[this.state.tab].filter((r) => !q || (r.title + ' ' + r.seat).toLowerCase().includes(q));
    const size = 4;
    const pageCount = Math.max(1, Math.ceil(list.length / size));
    const page = Math.min(this.state.page, pageCount);
    const tabs = [['up', 'Sắp diễn ra'], ['past', 'Đã qua'], ['refund', 'Đã hoàn']].map(([k, label]) => ({
      label: label + ' (' + data[k].length + ')',
      selected: this.state.tab === k ? 'true' : 'false',
      cls: this.state.tab === k ? 'tab tab-on' : 'tab',
      pick: () => this.setState({ tab: k, page: 1 }),
    }));
    return {
      q: this.state.q,
      onSearch: (e) => this.setState({ q: e.target.value, page: 1 }),
      tabs,
      rows: list.slice((page - 1) * size, page * size),
      empty: list.length === 0,
      page, pageCount,
      atStart: page === 1,
      atEnd: page === pageCount,
      prev: () => this.setState({ page: Math.max(1, page - 1) }),
      next: () => this.setState({ page: Math.min(pageCount, page + 1) }),
    };
  }
}
</script>
</body>
</html>
