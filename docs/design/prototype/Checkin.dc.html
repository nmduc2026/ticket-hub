.sh-apps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sh-f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500}

/* === hết khung khách === */

.tb{display:flex;align-items:flex-start;gap:12px;flex-wrap:nowrap}
.tb-l{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tb-r{display:flex;gap:8px;align-items:center;flex-shrink:0}

.cnt-b{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--primary-soft);color:var(--on-primary-soft);font-size:12px;font-weight:600;box-sizing:border-box}
.ov-bd{position:absolute;inset:0}

.csel-bd{position:fixed;inset:0;z-index:90}

/* === hết UX pass === */

.ov-bd,.bd,.csel-bd,.pal-bd,.sh-bd,.sheet-scrim{border:0;padding:0;margin:0;cursor:default;display:block;-webkit-appearance:none;appearance:none}

<div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; padding-top: 36px; gap: 16px; background: #0A0F0D">

<section aria-live="polite" style="background: var(--surface); color: var(--fg); padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 14px; flex-shrink: 0; border-top: 4px solid {{v.bar}}">
<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 40px; height: 40px; border-radius: 50%; background: {{v.bar}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<sc-if value="{{isValid}}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></sc-if>
<sc-if value="{{isUsed}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4M12 16h.01"></path></svg></sc-if>
<sc-if value="{{isForged}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></sc-if>
</span>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 18px; font-weight: 600">{{v.title}}</span>
<span style="font-size: 13px; color: var(--fg-muted)">{{v.detail}}</span>
</div>
</div>
<dl style="margin: 0; display: grid; grid-template-columns: 96px minmax(0, 1fr); row-gap: 8px; font-size: 13px">
<sc-for list="{{v.rows}}" as="r" hint-placeholder-count="3">
<dt style="color: var(--fg-muted)">{{r.k}}</dt><dd style="margin: 0; font-weight: 500">{{r.v}}</dd>
</sc-for>
</dl>
<button onClick="{{nextScan}}" type="button" style="height: 48px; border-radius: 8px; border: none; background: var(--primary); color: var(--on-primary); font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer">Quét vé tiếp theo</button>
</section>
</div>

<script type="text/x-dc" data-dc-script data-props='{"result": {"editor": "enum", "options": ["valid", "used", "forged"], "default": "valid"}, "$preview": {"width": 390, "height": 844}, "theme": {"editor": "enum", "options": ["system", "light", "dark"], "default": "system"}}'>
class Component extends DCLogic {
  renderVals0() { return Object.assign({ themeMode: this.props.theme || 'system' }, this.renderBase()); }
  renderBase() {
    const result = (this.state && this.state.result) || this.props.result || 'valid';
    const variants = {
      valid: { bar: 'var(--success-dot)', title: 'Hợp lệ', detail: 'Đã ghi nhận check-in lúc 19:42', rows: [{ k: 'Vị trí', v: 'VIP · Hàng B · Ghế 7' }, { k: 'Mã vé', v: 'TK-4Q9X-B7' }, { k: 'Người mua', v: 'Nguyễn Văn An' }] },
      used: { bar: 'var(--warning-dot)', title: 'Vé đã được sử dụng', detail: 'Không cho vào lần hai', rows: [{ k: 'Check-in lúc', v: '19:31 · Cổng 1' }, { k: 'Vị trí', v: 'VIP · Hàng B · Ghế 7' }, { k: 'Mã vé', v: 'TK-4Q9X-B7' }] },
      forged: { bar: 'var(--danger)', title: 'Vé không hợp lệ', detail: 'Chữ ký số không khớp', rows: [{ k: 'Lý do', v: 'Mã QR không do Ticket Hub phát hành' }, { k: 'Xử lý', v: 'Không cho vào, báo quản lý cổng' }] },
    };
    return {
      v: variants[result] || variants.valid,
      isValid: result === 'valid',
      isUsed: result === 'used',
      isForged: result === 'forged',
    };
  }
  renderVals() { const v = this.renderVals0(); return Object.assign(v, this.custVals(v)); }
  custVals(v) {
    const s = this.state || {};
    const set = (o) => this.setState(o);
    const cur = s.theme || v.themeMode || 'system';
    const dark = cur === 'dark' || (cur === 'system' && typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    const out = {
      themeMode: s.theme || v.themeMode,
      toggleTheme: () => set({ theme: dark ? 'light' : 'dark' }),
      shareOpen: !!s.share, openShare: () => set({ share: true, copied: false }), closeShare: () => set({ share: false }),
      copyLink: () => set({ copied: true }), copyLabel: s.copied ? 'Đã chép' : 'Chép liên kết',
      shareTo: () => set({ share: false, gToast: 'Đang mở ứng dụng để chia sẻ' }),
      contactOpen: !!s.contact, openContact: () => set({ contact: true }), closeContact: () => set({ contact: false }),
      sendContact: () => set({ contact: false, gToast: 'Đã gửi tin nhắn. Ban tổ chức trả lời qua email.' }),
      addCal: () => set({ gToast: 'Đã tải file lịch dem-nhac-rock-sai-gon.ics' }),
      dlPdf: () => set({ gToast: 'Đang tải vé PDF' }),
      discard: () => set({ gToast: 'Đã khôi phục giá trị đã lưu' }),
      gToastOn: !!s.gToast, gToastMsg: s.gToast || '', hideGToast: () => set({ gToast: '' }),
    };
    return Object.assign(out, this.extraVals ? this.extraVals(s, v) : {});
  }
  extraVals(s, v) {
    const order = ['valid', 'used', 'forged'];
    const cur = s.result || this.props.result || 'valid';
    return { nextScan: () => this.setState({ result: order[(order.indexOf(cur) + 1) % order.length] }) };
  }
}
</script>
