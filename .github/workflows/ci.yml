name: CI

# Mọi PR và mọi lần push vào main chạy đủ: quét secret, backend, frontend, E2E đăng nhập 3 role, build + quét image.
# Image chỉ được đẩy lên GHCR khi push vào main và các job trước đều xanh.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Quét secret (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend (Spotless, Error Prone, test, JaCoCo, SonarCloud)
    runs-on: ubuntu-24.04
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0 # SonarCloud cần lịch sử để gán dòng mới / cũ
      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # verify = biên dịch với Error Prone + test (Testcontainers cần Docker, có sẵn trên runner) + Spotless + JaCoCo.
      - name: Build và test
        working-directory: backend
        run: ./mvnw -B -ntp verify
      # Chưa cấu hình SonarCloud (thiếu secret SONAR_TOKEN và biến SONAR_PROJECT_KEY / SONAR_ORGANIZATION) thì bỏ qua.
      - name: SonarCloud
        if: ${{ env.SONAR_TOKEN != '' && github.event.pull_request.head.repo.fork != true }}
        working-directory: backend
        run: >
          ./mvnw -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
          -Dsonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml
      - name: Kiểm hợp đồng OpenAPI không lệch
        run: git diff --exit-code -- frontend/openapi/openapi.json
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: backend-jars
          path: |
            backend/app/target/app-*-SNAPSHOT.jar
            backend/gateway/target/gateway-*-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 3

  frontend:
    name: Frontend (lint, type-check, test, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm 10 lỗi khi phân giải peer dependency của Vite 8 (xem frontend/README.md).
      - run: npm install -g npm@11.6.2
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Client sinh từ OpenAPI không lệch
        run: |
          npm run api:generate
          git diff --exit-code -- src/api/generated

  e2e:
    name: E2E đăng nhập 3 role (Playwright)
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # Giá trị giả của máy dev, trùng infra/docker-compose/.env.example.
      DB_PASSWORD: '123123'
      REDIS_PASSWORD: '123123'
      KEYCLOAK_BFF_CLIENT_SECRET: '123123'
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/download-artifact@v4.3.0
        with:
          name: backend-jars
          path: jars
      - name: Dựng Postgres, Redis, Keycloak
        working-directory: infra/docker-compose
        run: |
          cp .env.example .env
          docker compose --profile core up -d --wait postgres redis keycloak
      - name: Chạy app và gateway
        run: |
          app_jar=$(find jars -name 'app-*-SNAPSHOT.jar' | head -n 1)
          gateway_jar=$(find jars -name 'gateway-*-SNAPSHOT.jar' | head -n 1)
          nohup java -jar "$app_jar" > app.log 2>&1 &
          nohup java -jar "$gateway_jar" > gateway.log 2>&1 &
          for port in 8081 8080; do
            for _ in $(seq 1 60); do
              curl -sf "http://localhost:${port}/actuator/health" > /dev/null && break
              sleep 2
            done
            curl -sf "http://localhost:${port}/actuator/health"
          done
      - name: Cài frontend và trình duyệt
        working-directory: frontend
        run: |
          npm install -g npm@11.6.2
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Chạy Vite dev và Playwright
        working-directory: frontend
        run: |
          nohup npx vite > ../vite.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://localhost:5173 > /dev/null && break; sleep 1; done
          npx playwright test
      - name: Log khi lỗi
        if: failure()
        run: tail -n 100 app.log gateway.log vite.log
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  images:
    name: Image ${{ matrix.image }} (build, Trivy, GHCR)
    needs: [secrets, backend, frontend, e2e]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: app
            context: backend
            file: backend/Dockerfile
            args: MODULE=app
          - image: gateway
            context: backend
            file: backend/Dockerfile
            args: MODULE=gateway
          - image: frontend
            context: frontend
            file: frontend/Dockerfile
            args: ''
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: docker/setup-buildx-action@v3.11.1
      - name: Tên image (chữ thường)
        run: echo "IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY,,}-${{ matrix.image }}" >> "$GITHUB_ENV"
      - name: Build (nạp vào Docker local để quét)
        uses: docker/build-push-action@v6.18.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.args }}
          load: true
          tags: ${{ env.IMAGE_NAME }}:scan
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      # Chặn khi có lỗ hổng CRITICAL đã có bản vá; HIGH chỉ báo trong log.
      - name: Trivy (CRITICAL chặn)
        uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Đăng nhập GHCR
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Đẩy image (chỉ từ main)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/build-push-action@v6.18.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.args }}
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:main
          cache-from: type=gha,scope=${{ matrix.image }}

  # Ghi tag image mới vào values của Helm; ArgoCD thấy commit này và đồng bộ vào k3d (GitOps, overview.md §19.3).
  # Commit bằng GITHUB_TOKEN không kích hoạt lại workflow. Nếu nhánh main bắt buộc PR thì bước push bị từ chối:
  # cho phép github-actions bỏ qua bảo vệ, hoặc đổi sang mở PR tự động (docs/ops/gitops.md).
  update-image-tags:
    name: Cập nhật image tag trong Helm values
    needs: [images]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Sửa tag
        run: |
          for chart in app gateway frontend; do
            sed -i -E "s|^(  tag: ).*|\1sha-${GITHUB_SHA}|" "infra/helm/${chart}/values.yaml"
          done
      - name: Commit và push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra/helm/*/values.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore(deploy): image tag sha-${GITHUB_SHA::7} [skip ci]"
          git push origin HEAD:main

  # OWASP Dependency-Check cho thư viện Maven. Cần secret NVD_API_KEY (miễn phí) để tải CVE nhanh; chưa có thì bỏ qua.
  dependency-check:
    name: OWASP Dependency-Check (backend)
    runs-on: ubuntu-24.04
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@v4.2.2
        if: ${{ env.NVD_API_KEY != '' }}
      - uses: actions/setup-java@v4.7.1
        if: ${{ env.NVD_API_KEY != '' }}
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Chặn khi có lỗ hổng CVSS >= 9 (CRITICAL).
      - name: Quét phụ thuộc
        if: ${{ env.NVD_API_KEY != '' }}
        working-directory: backend
        run: >
          ./mvnw -B -ntp org.owasp:dependency-check-maven:12.1.6:aggregate
          -DnvdApiKey=${NVD_API_KEY} -DfailBuildOnCVSS=9 -Dformats=HTML
      - uses: actions/upload-artifact@v4.6.2
        if: ${{ env.NVD_API_KEY != '' && always() }}
        with:
          name: dependency-check-report
          path: backend/target/dependency-check-report.html
          if-no-files-found: ignore
          retention-days: 7
